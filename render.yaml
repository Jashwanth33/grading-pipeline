services:
  - type: web
    name: grading-pipeline
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_NAME
        value: "GradingPipeline"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
