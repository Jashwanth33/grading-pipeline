services:
  - type: web
    name: grading-pipeline
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python start.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: "8000"
      - key: APP_NAME
        value: "GradingPipeline"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
